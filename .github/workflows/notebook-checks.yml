name: Academic notebooks · static validation

on:
  push:
    paths:
      - "projects/**"
      - "exercises/**"
      - "notebooks/**"
      - "datasets/**"
      - "scripts/**"
      - ".github/workflows/notebook-checks.yml"
  pull_request:
    paths:
      - "projects/**"
      - "exercises/**"
      - "notebooks/**"
      - "datasets/**"
      - "scripts/**"
      - ".github/workflows/notebook-checks.yml"
  workflow_dispatch:

jobs:
  validate-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_repository.py
